name: Sync, Build, and Deploy Knowledge Base

on:
  push:
    branches: [main]
    paths:
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/**'
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc rclone
          pip install -r requirements.txt

      - name: Securely Sync Google Drive Folder
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.readonly
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          mkdir -p gdrive_raw
          rclone sync gdrive: ./gdrive_raw --drive-root-folder-id=1ygFywxysJBWFJa4BB6rFFWnSvcvQNL6c

      - name: Process Documents and Generate Layouts
        run: |
          python - << 'EOF'
          import os
          import re
          import subprocess
          import zipfile
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime

          # Helper for natural sorting (e.g., '2' before '10')
          def natural_key(p):
              return [int(text) if text.isdigit() else text.lower() for text in re.split(r'(\d+)', p.name)]

          raw_dir = Path("gdrive_raw")
          docs_dir = Path("docs")
          docs_dir.mkdir(exist_ok=True)
          (docs_dir / "assets").mkdir(parents=True, exist_ok=True)

          # 1. Download logo safely if missing
          logo_path = docs_dir / "assets" / "logo.png"
          if not logo_path.exists():
              try:
                  req = urllib.request.Request(
                      "https://egybid.com/wp-content/uploads/2021/11/logo-horizontal.png",
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      logo_path.write_bytes(resp.read())
                  print("Logo downloaded successfully.")
              except Exception as e:
                  print("Logo download warning:", e)

          # 2. Convert all docx files recursively
          if raw_dir.exists():
              docx_files = list(raw_dir.rglob("*.docx"))
              print(f"Found {len(docx_files)} docx files.")

              for docx in docx_files:
                  if docx.stat().st_size == 0:
                      continue

                  rel_path = docx.relative_to(raw_dir)
                  out_md = docs_dir / rel_path.with_suffix(".md")
                  out_md.parent.mkdir(parents=True, exist_ok=True)
                  media_dir = out_md.parent / "assets"

                  # Dates extraction
                  update_date = datetime.fromtimestamp(docx.stat().st_mtime).strftime("%Y-%m-%d")
                  create_date = update_date
                  try:
                      with zipfile.ZipFile(docx) as z:
                          if "docProps/core.xml" in z.namelist():
                              xml = z.read("docProps/core.xml").decode("utf-8", errors="ignore")
                              m = re.search(r'<dcterms:created[^>]*>([^T<]+)', xml)
                              if m:
                                  create_date = m.group(1).strip()
                  except Exception:
                      pass

                  ym = create_date[:7]
                  title = docx.stem.strip()
                  if title == "-":
                      title = "مقال عام"
                  safe_title = title.replace('"', "'")

                  # Convert with Pandoc
                  cmd = [
                      "pandoc", "-f", "docx", "-t", "gfm-raw_html",
                      str(docx), "-o", str(out_md),
                      f"--extract-media={media_dir}"
                  ]
                  res = subprocess.run(cmd, check=False)
                  if res.returncode == 0 and out_md.exists():
                      content = out_md.read_text(encoding="utf-8", errors="ignore")
                      # Clean Word artifacts safely without breaking markdown links
                      content = re.sub(r'\{dir="rtl"\}', '', content)
                      content = re.sub(r'\{\.underline\}', '', content)
                      content = re.sub(r'\\$', '', content, flags=re.MULTILINE)

                      # Ensure H1 heading exists
                      h1_header = ""
                      if not re.search(r'^\s*#\s+', content, re.MULTILINE):
                          h1_header = f"# {title}\n\n"

                      frontmatter = (
                          f"---\n"
                          f"title: \"{safe_title}\"\n"
                          f"date: {create_date}\n"
                          f"tags:\n"
                          f"  - \"{ym}\"\n"
                          f"---\n\n"
                          f"{h1_header}📅 **تاريخ النشر:** {create_date} | 🔄 **آخر تحديث:** {update_date}\n\n"
                          f"---\n\n"
                      )
                      out_md.write_text(frontmatter + content, encoding="utf-8")
                      try:
                          dt = datetime.strptime(create_date, "%Y-%m-%d")
                          ts = dt.timestamp()
                          os.utime(out_md, (ts, ts))
                      except Exception:
                          pass

          # 3. Build Navigation and Category Indexes
          nav_lines = [
              "\nnav:\n",
              "  - الصفحة الرئيسية: index.md\n"
          ]

          home_content = [
              "# المكتب المصرى للتطوير الصناعي",
              "",
              "مرحباً بك في قاعدة المعرفة والمقالات الإدارية والصناعية للمهندس **محمود مرزوق**.",
              "",
              "> يمكنك استخدام شريط البحث بالأعلى للبحث في كافة الموضوعات، أو تصفح الأقسام الرئيسية أدناه.",
              "",
              "## 📚 الأقسام الرئيسية",
              "",
              '<div class="grid cards" markdown>',
              ""
          ]

          # Discover top-level category folders
          top_folders = sorted(
              [d for d in docs_dir.iterdir() if d.is_dir() and d.name not in ["assets", "dates"]],
              key=natural_key
          )

          all_dates = {}

          for folder in top_folders:
              articles = sorted(
                  [f for f in folder.rglob("*.md") if f.name != "index.md"],
                  key=natural_key
              )
              if not articles:
                  continue

              count = len(articles)
              latest_mtime = max(a.stat().st_mtime for a in articles)
              latest_date = datetime.fromtimestamp(latest_mtime).strftime("%Y-%m-%d")
              safe_folder = folder.name.replace('"', "'")

              nav_lines.append(f'  - "{safe_folder} ({count}) [{latest_date}]": "{folder.name}/index.md"\n')

              home_content.append(f"-   [**{folder.name}**]({urllib.parse.quote(folder.name, safe='/#?=')}/index.md)")
              home_content.append("    ---")
              home_content.append(f"    📁 {count} مقال | 🔄 آخر تحديث: `{latest_date}`\n")

              # Build Category index.md
              cat_index = folder / "index.md"
              cat_lines = [
                  f"# {folder.name}",
                  "",
                  f"> يحتوي هذا القسم على **{count}** مقال ودراسة.",
                  "",
                  '<div class="grid cards" markdown>',
                  ""
              ]

              for art in articles:
                  rel_from_cat = art.relative_to(folder).as_posix()
                  encoded_rel = urllib.parse.quote(rel_from_cat, safe="/#?=")
                  art_title = art.stem.strip()
                  if art_title == "-":
                      art_title = "مقال عام"
                  post_date = datetime.fromtimestamp(art.stat().st_mtime).strftime("%Y-%m-%d")
                  ym_date = post_date[:7]
                  all_dates.setdefault(ym_date, []).append((art, folder.name))

                  cat_lines.append(f"-   [**{art_title}**]({encoded_rel})")
                  cat_lines.append("    ---")
                  cat_lines.append(f"    🗓️ `{post_date}`\n")

              cat_lines.append("</div>\n")
              cat_index.write_text("\n".join(cat_lines), encoding="utf-8")

          # Root articles if any exist directly in docs/
          root_articles = sorted(
              [f for f in docs_dir.glob("*.md") if f.name != "index.md"],
              key=natural_key
          )
          if root_articles:
              home_content.append('</div>\n\n## 📄 مقالات عامة\n\n<div class="grid cards" markdown>\n')
              for art in root_articles:
                  encoded_rel = urllib.parse.quote(art.name, safe="/#?=")
                  art_title = art.stem.strip()
                  if art_title == "-":
                      art_title = "مقال عام"
                  post_date = datetime.fromtimestamp(art.stat().st_mtime).strftime("%Y-%m-%d")
                  ym_date = post_date[:7]
                  all_dates.setdefault(ym_date, []).append((art, ""))
                  home_content.append(f"-   [**{art_title}**]({encoded_rel})")
                  home_content.append("    ---")
                  home_content.append(f"    🗓️ `{post_date}`\n")

          home_content.append("</div>\n")
          (docs_dir / "index.md").write_text("\n".join(home_content), encoding="utf-8")

          # 4. Build Date Archive
          dates_dir = docs_dir / "dates"
          dates_dir.mkdir(exist_ok=True)

          if all_dates:
              nav_lines.append('  - "📅 الأرشيف حسب التاريخ":\n')
              for ym in sorted(all_dates.keys(), reverse=True):
                  items = all_dates[ym]
                  d_count = len(items)
                  date_file = dates_dir / f"{ym}.md"
                  date_lines = [
                      f"# مقالات شهر {ym}",
                      "",
                      f"> إجمالي مقالات هذا الشهر: **{d_count}** مقال.",
                      "",
                      '<div class="grid cards" markdown>',
                      ""
                  ]
                  for art, cat_name in items:
                      if cat_name:
                          rel_from_docs = art.relative_to(docs_dir).as_posix()
                      else:
                          rel_from_docs = art.name
                      encoded_rel = "../" + urllib.parse.quote(rel_from_docs, safe="/#?=")
                      art_title = art.stem.strip()
                      if art_title == "-":
                          art_title = "مقال عام"
                      full_date = datetime.fromtimestamp(art.stat().st_mtime).strftime("%Y-%m-%d")
                      badge = f"📁 {cat_name} | " if cat_name else ""
                      date_lines.append(f"-   [**{art_title}**]({encoded_rel})")
                      date_lines.append("    ---")
                      date_lines.append(f"    {badge}🗓️ `{full_date}`\n")
                  date_lines.append("</div>\n")
                  date_file.write_text("\n".join(date_lines), encoding="utf-8")
                  nav_lines.append(f'    - "{ym} ({d_count})": "dates/{ym}.md"\n')

          # Append dynamic navigation to mkdocs.yml
          with open("mkdocs.yml", "a", encoding="utf-8") as f:
              f.writelines(nav_lines)

          print("Layouts and navigation built successfully.")
          EOF

      - name: Build MkDocs Site
        run: mkdocs build --clean

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
