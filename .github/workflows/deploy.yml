# ====================================
# SITE INFORMATION
# ====================================
site_name: مقالات المكتب المصرى للتطوير الصناعي # The main title of your website
site_description: مقالات المكتب المصرى للتطوير الصناعي # Brief description
site_author: م/محمود مرزوق

# ====================================
# UI, HEADERS, AND THEME
# ====================================
theme:
  name: material
  language: ar # Sets the core UI language to Arabic
  direction: rtl # Enforces Right-to-Left layout globally

  # Font Configuration
  font:
    text: Tajawal # A clean, modern Arabic font from Google Fonts
    code: Roboto Mono # Font for any code snippets

  # Color Palette & Dark Mode Toggle
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: تفعيل الوضع الداكن
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: تفعيل الوضع المضيء

  # Page Elements and Headers
  features:
    - navigation.sections # Groups sub-folders neatly in the sidebar
    - navigation.expand # Creates the collapsible tree on the right side
    - navigation.top # Adds a "Back to Top" button when scrolling
    - header.autohide # Hides the top header when scrolling down for more reading space
    - search.suggest # Suggests words while typing in the search bar
    - search.highlight # Highlights the searched word inside the article

# ====================================
# PLUGINS & EXTENSIONS
# ====================================
plugins:
  - search:
      lang: ar # Optimizes the search engine index specifically for Arabic

markdown_extensions:
  - tables # Ensures tables in Word translate correctly
  - admonition # Allows for styled warning/info boxes
  - attr_list
  - md_in_html
