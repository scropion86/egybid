name: Sync, Build, and Deploy Knowledge Base

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install mkdocs-material
          sudo apt-get install -y pandoc rclone

      - name: Securely Sync Google Drive Folder
        env:
          # This pulls your encrypted key from GitHub Secrets
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          # Create a secure configuration file for rclone
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_credentials = $SA_JSON
          EOF
          
          # Sync the folder securely using the API, bypassing anonymous limits
          rclone sync gdrive: ./gdrive_raw --drive-root-folder-id=1ygFywxysJBWFJa4BB6rFFWnSvcvQNL6c --config=~/.config/rclone/rclone.conf

      - name: Convert Word Docs to Markdown
        run: |
          mkdir -p docs
          
          find ./gdrive_raw -name "*.docx" -print0 | while IFS= read -r -d '' file; do
            rel_path="${file#./gdrive_raw/}"
            dir_path=$(dirname "$rel_path")
            filename=$(basename "$file" .docx)
            
            mkdir -p "docs/$dir_path"
            
            pandoc -f docx -t markdown "$file" \
              -o "docs/$dir_path/$filename.md" \
              --extract-media="docs/$dir_path/assets"
          done

          if [ ! -f docs/index.md ]; then
            echo "# الصفحة الرئيسية" > docs/index.md
            echo "مرحباً بك في قاعدة المعرفة. يرجى اختيار أحد الأقسام من القائمة للتصفح." >> docs/index.md
          fi

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
