name: Sync, Build, and Deploy Knowledge Base

on:
  schedule:
    - cron: '0 0 * * *'           # Automatically runs every night at midnight UTC
  workflow_dispatch:              # Adds a manual "Run workflow" button in GitHub

permissions:
  contents: write                 # Required permission to publish to GitHub Pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install mkdocs-material
          sudo apt-get install -y pandoc rclone

      - name: Securely Sync Google Drive Folder
        env:
          # Define the rclone config directly via environment variables
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.readonly
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          # Sync the folder securely using the API and environment variables
          rclone sync gdrive: ./gdrive_raw --drive-root-folder-id=1ygFywxysJBWFJa4BB6rFFWnSvcvQNL6c

      - name: Convert Word Docs to Markdown
        run: |
          # Create the directory MkDocs expects
          mkdir -p docs
          
          # Find all .docx files, handle spaces in filenames safely, and convert them
          find ./gdrive_raw -name "*.docx" -print0 | while IFS= read -r -d '' file; do
            # Extract the folder structure so categories are maintained
            rel_path="${file#./gdrive_raw/}"
            dir_path=$(dirname "$rel_path")
            filename=$(basename "$file" .docx)
            
            # Recreate the specific sub-folder inside the docs directory
            mkdir -p "docs/$dir_path"
            
            # Convert the document and extract any images into an assets folder
            pandoc -f docx -t markdown "$file" \
              -o "docs/$dir_path/$filename.md" \
              --extract-media="docs/$dir_path/assets"
          done

          # CRITICAL: Auto-generate the homepage (index.md) if there wasn't a Word doc named 'index.docx'
          if [ ! -f docs/index.md ]; then
            echo "# الصفحة الرئيسية" > docs/index.md
            echo "مرحباً بك في قاعدة المعرفة. يرجى اختيار أحد الأقسام من القائمة للتصفح." >> docs/index.md
          fi

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
