# ====================================
# SITE INFORMATION
# ====================================
site_name: مقالات المكتب المصرى للتطوير الصناعي
site_description: مقالات ودراسات المكتب المصرى للتطوير الصناعي - م. محمود مرزوق
site_author: م-محمود مرزوق
site_url: https://mlotfy.win/egybid/

# ====================================
# UI, HEADERS, AND THEME
# ====================================
theme:
  name: material
  language: ar
  direction: rtl

  # Logo & Favicon
  logo: assets/logo.png
  favicon: assets/logo.png

  font:
    text: Tajawal
    code: Roboto Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: تفعيل الوضع الداكن
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: تفعيل الوضع المضيء

  features:
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.path
    - header.autohide
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - assets/stylesheets/custom.css

plugins:
  - search:
      lang:
        - ar
        - en
      separator: '[\s\-\.\,\(\)\[\]\/]+'
  - tags

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# ====================================
# FOOTER SOCIAL LINKS
# ====================================
extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://egybid.com/
      name: Website
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/Marzouk01272873007/
      name: Facebook
